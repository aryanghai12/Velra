[package]
name = "velra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[[bin]]
name = "velra"
path = "src/main.rs"

# `cargo binstall velra` fetches the signed release archive built by
# .github/workflows/release.yml instead of compiling. This is the path that
# needs no C compiler, no Visual Studio Build Tools and no linker setup.
#
# Archives are flat: the binary sits at the archive root next to README.md,
# LICENSE and SECURITY.md.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/velra-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/velra-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/velra-{ target }.zip"
pkg-fmt = "zip"

# Windows-GNU hosts have no release artifact of their own; the MSVC binary is
# statically linked and runs there unchanged.
[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/velra-x86_64-pc-windows-msvc.zip"
pkg-fmt = "zip"

[features]
# Enables VELRA_TEST_* fault injection (panic / stall) used by acceptance tests G2/G3.
fault-injection = []

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
rusqlite = "0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value", "preserve_order"] }
similar = "3.2.0"
toml = "1.1.6"
ulid = "3.0.0"
velra-core = { version = "0.1.0", path = "../velra-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"
