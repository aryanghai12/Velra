<rect x="20" y="216" width="520" height="140" rx="10" fill="#f3f2ee"/>
<text x="32" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="600">WHEN YOU RUN velra restore · explicit, you name the source</text>
<rect x="552" y="216" width="328" height="140" rx="10" fill="#eef4fb"/>
