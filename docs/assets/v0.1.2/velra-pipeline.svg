<text x="24" y="382" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">clear, resume, compact and fork session starts leave the staged capsule alone · delivery is at most once · expires after 7 days</text>
<text x="24" y="402" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">The same snapshot and renderer serve the /compact continuation, which is only ever delivered back into the session that produced it.</text>
