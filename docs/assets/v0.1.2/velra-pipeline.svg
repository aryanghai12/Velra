<text x="637.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Claim once</text>
<text x="637.0" y="278.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">SessionStart(startup)</text>
