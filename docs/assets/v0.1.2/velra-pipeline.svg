<text x="105.0" y="278.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">current epoch of</text>
<text x="105.0" y="294.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">session A</text>
<rect x="200" y="230" width="150" height="88" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/>
<text x="275.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Render</text>
<text x="275.0" y="278.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">pure, deterministic</text>
<text x="275.0" y="294.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">≤ 740 target, 1,000 max</text>
<rect x="370" y="230" width="150" height="88" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
<text x="445.0" y="262.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Stage</text>
<text x="445.0" y="278.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">staged/&lt;workspace_id&gt;/</text>
<text x="445.0" y="294.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">capsule.&lt;gen&gt;.json</text>
