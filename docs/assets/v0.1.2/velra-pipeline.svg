<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">Velra pipeline, v0.1.2</title>
<desc id="d">Row one, automatic in the source session: Claude Code hook events are captured by velra hook, normalised, redacted and capped, appended to the SQLite ledger or spooled when the database is busy, and reduced in logical order into task state. Row two, explicit: velra restore builds a snapshot of the source session you name, renders it within the token budget, and stages one capsule for the workspace. At the next SessionStart with source startup in the same workspace, the hook claims the capsule once and delivers it as additionalContext to the new destination session.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="900" height="420" rx="8" fill="#fcfcfb"/>
<text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Velra pipeline: from a source session to a new destination session</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">Everything runs locally in one binary and one SQLite database. No model, no network.</text>
<rect x="20" y="74" width="860" height="128" rx="10" fill="#f3f2ee"/>
<text x="32" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="600">IN THE SOURCE SESSION · automatic, on every hook</text>
<rect x="30" y="104" width="190" height="82" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="125.0" y="133.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Source session</text>
<text x="125.0" y="149.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">Claude Code, session id A</text>
<text x="125.0" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">prompts · tools · tests</text>
<rect x="250" y="104" width="190" height="82" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/>
<text x="345.0" y="133.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Capture</text>
<text x="345.0" y="149.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">velra hook &lt;event&gt;</text>
<text x="345.0" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">normalise · redact · cap</text>
<rect x="470" y="104" width="190" height="82" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/>
<text x="565.0" y="133.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Ledger</text>
<text x="565.0" y="149.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">events table, SQLite WAL</text>
<text x="565.0" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">spool/ when the DB is busy</text>
<rect x="690" y="104" width="190" height="82" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/>
<text x="785.0" y="133.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Reduce</text>
<text x="785.0" y="149.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">events in logical order</text>
<text x="785.0" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">→ task-state tables</text>
