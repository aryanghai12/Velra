<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
<title id="t">Workspaces, sessions and a restore</title>
<desc id="d">A workspace, identified by a hash of its canonical root, owns sessions and at most one staged capsule. Session A, the source, records events into the local ledger. Running velra restore and naming session A renders its state and stages one capsule for the workspace. The next SessionStart with source startup in the same workspace, session B with its own new id, claims it once. clear, resume, compact and fork leave it staged. A session in another workspace never receives it.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="900" height="430" rx="8" fill="#fcfcfb"/>
<text x="24" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Session A → explicit restore → Session B</text>
<text x="24" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="normal">The capsule is state from the source session, delivered to a new destination. Sessions are never merged.</text>
<rect x="20" y="74" width="860" height="258" rx="10" fill="#f3f2ee"/>
<text x="32" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="600">WORKSPACE  ~/src/payments   ·   id = first 16 hex of blake3(canonical root)</text>
<rect x="40" y="118" width="200" height="96" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="140.0" y="146.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Session A · source</text>
<text x="140.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">87901fc6-…</text>
<text x="140.0" y="178.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">prompts, edits, tests,</text>
<text x="140.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">a revert, the next step</text>
<rect x="350" y="104" width="200" height="56" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/>
<text x="450.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Ledger</text>
<text x="450.0" y="144.0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">~/.velra/velra.db</text>
<rect x="350" y="190" width="200" height="70" rx="8" fill="#ffffff" stroke="#b9b8b1" stroke-width="1.5"/>
<text x="450.0" y="213.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">velra restore --session</text>
<text x="450.0" y="229.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">you name the source</text>
<text x="450.0" y="245.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">snapshot → render → stage</text>
<rect x="350" y="282" width="200" height="40" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
<text x="450.0" y="306.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">staged capsule (one per workspace)</text>
<rect x="660" y="118" width="200" height="96" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="760.0" y="146.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">Session B · destination</text>
<text x="760.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">new session id</text>
<text x="760.0" y="178.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">first turn starts with</text>
<text x="760.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal">the capsule in context</text>
<path d="M240,150 L346,132" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="293" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#76756f" text-anchor="middle" font-weight="normal">hooks</text>
<path d="M450,160 L450,186" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M450,260 L450,278" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M550,302 L620,302 L620,190 L656,190" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
<text x="636" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">SessionStart</text>
<text x="636" y="264" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">(startup)</text>
<text x="636" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">claimed once</text>
<text x="24" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Session start source:   startup → delivered, then deleted   ·   clear, resume, compact, fork, unknown → left staged</text>
<text x="24" y="378" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Another workspace → never delivered   ·   hash, workspace, format or age check fails → refused, never replaced by an older record</text>
<text x="24" y="398" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="normal">Killed after writing but before recording the delivery → not delivered again (at most once); restage with velra restore</text>
</svg>
